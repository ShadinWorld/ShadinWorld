<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="310" viewBox="0 0 1280 310" role="img" aria-labelledby="title desc">
  <title id="title">Mosharof Hossain — Packet to Pixel</title>
  <desc id="desc">A custom dark neon banner connecting networking infrastructure and digital product development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111c"/><stop offset=".52" stop-color="#0d1117"/><stop offset="1" stop-color="#17102a"/></linearGradient>
