name: Generate 3D Contribution Calendar

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/3d-contrib.yml"
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-calendar-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ShadinWorld
          MAX_REPOS: 200

      - name: Publish day and night SVGs to output-3d-contrib branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output-3d-contrib
          publish_dir: profile-3d-contrib
          force_orphan: true
