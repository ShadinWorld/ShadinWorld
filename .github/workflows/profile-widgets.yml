name: Refresh profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate_profile_widgets.py"
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate local SVG cards from public GitHub data
        run: python scripts/generate_profile_widgets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/public-activity.svg assets/profile-footprint.svg assets/language-breakdown.svg
          if git diff --cached --quiet; then
            echo "No changes to generated cards."
          else
            git commit -m "chore: refresh public profile cards"
            git push
          fi
