name: Generate 3D contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "conf/github-profile-3d-contrib.json"
      - ".github/workflows/3d-contrib.yml"

permissions:
  contents: write

concurrency:
  group: contribution-calendar-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ShadinWorld
          MAX_REPOS: 100
          SETTING_JSON: conf/github-profile-3d-contrib.json
      - name: Commit generated 3D calendar images
        run: |
          cp profile-3d-contrib/day.svg assets/contrib-3d-day.svg
          cp profile-3d-contrib/night.svg assets/contrib-3d-night.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d-day.svg assets/contrib-3d-night.svg
          if git diff --cached --quiet; then
            echo "No 3D calendar asset changes."
          else
            git commit -m "chore: refresh 3D contribution calendar"
            git push
          fi
